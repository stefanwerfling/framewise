[package]
name = "framewise"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Media Optimizer – analysiert und optimiert Video-Sammlungen für Plex und Jellyfin"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.37"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sysinfo = "0.40"
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2.5"
directories = "6"
rfd = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
